[package]
name = "hypercrypto"
version = "0.1.0"
edition = "2021"
authors = ["alreadydead0"]
license = "MIT"
description = "Ultra-fast Next-Generation MTProto 2.0 Cryptographic Engine for Telegram"

[lib]
name = "hypercrypto"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.24", features = ["extension-module", "abi3-py310"] }
aes = "0.8"
cipher = "0.4"
sha2 = "0.10"
ring = "0.17"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
incremental = false
